name: Build Lenzorium Player

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --org com.lenzorium --project-name lenzorium_player --platforms=android,windows
      - run: rm -f test/widget_test.dart
        shell: bash
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --dart-define=LICENCE_API=${{ vars.LICENCE_API || 'https://activate.lenzorium.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lenzorium-android-apks
          path: app/build/app/outputs/flutter-apk/*.apk

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --org com.lenzorium --project-name lenzorium_player --platforms=android,windows
      - run: rm -f test/widget_test.dart
        shell: bash
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=LICENCE_API=${{ vars.LICENCE_API || 'https://activate.lenzorium.com' }}
      - name: List Windows build (DLLs must be next to the exe)
        shell: bash
        run: ls -R build/windows/x64/runner/Release | head -50
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $env:APP_VERSION = "1.0.${{ github.run_number }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows-installer\lenzorium.iss
      - uses: actions/upload-artifact@v4
        with:
          name: lenzorium-windows
          path: app/build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: lenzorium-windows-setup
          path: out/Lenzorium-Player-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Package
        run: |
          mkdir out
          cp dist/lenzorium-android-apks/app-arm64-v8a-release.apk   out/Lenzorium-Player-Android-arm64.apk
          cp dist/lenzorium-android-apks/app-armeabi-v7a-release.apk out/Lenzorium-Player-FireTV-AndroidTV.apk
          cp dist/lenzorium-android-apks/app-x86_64-release.apk      out/Lenzorium-Player-Android-x86_64.apk
          cp dist/lenzorium-windows-setup/Lenzorium-Player-Setup.exe out/
          (cd dist/lenzorium-windows && zip -qr ../../out/Lenzorium-Player-Windows-portable.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lenzorium Player 1.0 (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Android TV / Fire TV Stick / most phones:** Lenzorium-Player-FireTV-AndroidTV.apk
            **Newer phones and Fire TV 4K Max (faster):** Lenzorium-Player-Android-arm64.apk
            **Windows 10/11:** download Lenzorium-Player-Setup.exe and run it (Windows may say "Windows protected your PC": click More info › Run anyway)
            Portable Windows version: extract ALL of Lenzorium-Player-Windows-portable.zip first, then run lenzorium_player.exe from the extracted folder

            Lenzorium Player does not provide any content. Use it only with content you are legally allowed to access.
          files: out/*
