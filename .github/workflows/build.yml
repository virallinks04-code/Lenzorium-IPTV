name: Build Lenzorium Player

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --org com.lenzorium --project-name lenzorium_player --platforms=android,windows
      - run: rm -f test/widget_test.dart
        shell: bash
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --dart-define=LICENCE_API=${{ vars.LICENCE_API || 'https://activate.lenzorium.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lenzorium-android-apks
          path: app/build/app/outputs/flutter-apk/*.apk

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create . --org com.lenzorium --project-name lenzorium_player --platforms=android,windows
      - run: rm -f test/widget_test.dart
        shell: bash
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=LICENCE_API=${{ vars.LICENCE_API || 'https://activate.lenzorium.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: lenzorium-windows
          path: app/build/windows/x64/runner/Release/

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Package
        run: |
          mkdir out
          cp dist/lenzorium-android-apks/app-arm64-v8a-release.apk   out/Lenzorium-Player-Android-arm64.apk
          cp dist/lenzorium-android-apks/app-armeabi-v7a-release.apk out/Lenzorium-Player-FireTV-AndroidTV.apk
          cp dist/lenzorium-android-apks/app-x86_64-release.apk      out/Lenzorium-Player-Android-x86_64.apk
          (cd dist/lenzorium-windows && zip -qr ../../out/Lenzorium-Player-Windows.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lenzorium Player 1.0 (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Android TV / Fire TV Stick / most phones:** Lenzorium-Player-FireTV-AndroidTV.apk
            **Newer phones and Fire TV 4K Max (faster):** Lenzorium-Player-Android-arm64.apk
            **Windows 10/11:** unzip Lenzorium-Player-Windows.zip and run lenzorium_player.exe

            Lenzorium Player does not provide any content. Use it only with content you are legally allowed to access.
          files: out/*
