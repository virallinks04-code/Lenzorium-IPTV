name: lenzorium_player
description: Lenzorium IPTV Player — plays the customer's own M3U or Xtream Codes playlist on Windows, Android, Android TV and Fire TV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Playback (libmpv)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Local catalogue database (raw SQL, no code generation)
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24

  # State, storage, networking
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  http: ^1.2.2
  file_picker: ^10.3.3
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true
  assets:
    - assets/

# Windows installer: `dart run msix:create`
msix_config:
  display_name: Lenzorium Player
  publisher_display_name: Lenzorium Technologies
  identity_name: Lenzorium.Player
  msix_version: 1.0.0.0
  logo_path: assets/logo.png
  capabilities: internetClient
  # certificate_path: C:\path\to\lenzorium_codesign.pfx
  # certificate_password: <set in CI, never commit>
